name: Build iOS (unsigned .ipa)

# Produces an unsigned .ipa that can be signed on Windows with Sideloadly or
# AltStore. There is deliberately no signing certificate in this workflow: the
# point is that a machine without Xcode — and without a paid Apple Developer
# account — can still get an installable artefact.
#
# Sideloadly and AltStore inject the certificate and profile themselves and
# re-sign the bundle, which only works if the build is genuinely unsigned. A
# half-signed build fails at install with a confusing profile error.

on:
  workflow_dispatch:
  push:
    # This repo's default branch is `master`, not `main`. Filtering on `main`
    # meant the workflow was valid but never fired on a push — and the only way
    # to tell the difference from "the workflow is broken" is to look.
    branches: [master, main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

jobs:
  build:
    # macos-14 ships Xcode 15, which is the first version with the Swift
    # concurrency in the Capacitor 8 iOS templates. Earlier runners fail to
    # compile the generated project.
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web bundle has to exist before the native sync, or the app ships
      # whatever was last committed into ios/App/public.
      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned archive
        run: |
          # The .xcodeproj, not the .xcworkspace. There is no workspace here:
          # Capacitor 8 pulls its iOS dependency in via SwiftPM (CapApp-SPM),
          # and no CocoaPods step ever runs, so no .xcworkspace is generated.
          # Pointing xcodebuild at one fails instantly with
          # "does not exist", which is exactly what the first run did.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kinora.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package the .ipa
        run: |
          # The app must be named Payload.app inside the archive or iOS will
          # refuse the install. Xcode does not always do this for an unsigned
          # archive, so it is done explicitly rather than trusted.
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Kinora.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/Kinora.app"
          cd "$RUNNER_TEMP"
          zip -qry Kinora-unsigned.ipa Payload

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kinora-unsigned-ipa
          path: ${{ runner.temp }}/Kinora-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
